<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Poppins, 'Century Gothic', Montserrat, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#143352"/>
      <stop offset="55%" stop-color="#0B1A2B"/>
      <stop offset="100%" stop-color="#05080D"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F0A03A"/>
      <stop offset="100%" stop-color="#E8821E"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- subtle water rings -->
  <g stroke="#2C5A82" stroke-width="2" fill="none" opacity="0.25">
    <circle cx="880" cy="240" r="120"/>
    <circle cx="880" cy="240" r="180"/>
    <circle cx="200" cy="1150" r="140"/>
    <circle cx="200" cy="1150" r="210"/>
  </g>

  <!-- logo wordmark -->
  <text x="540" y="150" text-anchor="middle" fill="#9FB3C8" font-size="26" letter-spacing="6">MY PURE</text>
  <text x="540" y="205" text-anchor="middle" fill="#FFFFFF" font-size="64" font-weight="700" letter-spacing="1">filter</text>

  <!-- water drop motif -->
  <path d="M540 330 C 590 405, 615 445, 615 495 a 75 75 0 1 1 -150 0 C 465 445, 490 405, 540 330 Z"
        fill="none" stroke="url(#orange)" stroke-width="6"/>
  <circle cx="540" cy="495" r="14" fill="#E8821E"/>

  <!-- headline -->
  <text x="540" y="690" text-anchor="middle" fill="#FFFFFF" font-size="58" font-weight="600">If you're looking for pure,</text>
  <text x="540" y="760" text-anchor="middle" fill="#FFFFFF" font-size="58" font-weight="600">filtered, chlorine-free water</text>

  <text x="540" y="865" text-anchor="middle" fill="#E8821E" font-size="46" font-style="italic" font-weight="700">Welcome — you're in the right place.</text>

  <text x="540" y="950" text-anchor="middle" fill="#9FB3C8" font-size="34">Água pura, filtrada e sem cloro para sua família</text>

  <!-- CTA pill -->
  <rect x="330" y="1060" width="420" height="92" rx="46" fill="url(#orange)"/>
  <text x="540" y="1118" text-anchor="middle" fill="#0B1A2B" font-size="34" font-weight="700">Free Water Test → DM</text>

  <!-- footer badge -->
  <text x="540" y="1240" text-anchor="middle" fill="#FFFFFF" font-size="26" letter-spacing="3" opacity="0.9">OFFICIAL MY PURE FILTERS REP</text>
  <text x="540" y="1280" text-anchor="middle" fill="#9FB3C8" font-size="24" letter-spacing="4">ORLANDO  •  MIAMI</text>
</svg>
