<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Poppins, 'Century Gothic', Montserrat, Arial, sans-serif">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#14304e"/>
      <stop offset="60%" stop-color="#0B1A2B"/>
      <stop offset="100%" stop-color="#05080D"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg3)"/>

  <g transform="translate(540,90)" text-anchor="middle">
    <text y="0" fill="#9FB3C8" font-size="16" letter-spacing="6" font-weight="500">MY PURE</text>
    <text y="40" fill="#FFFFFF" font-size="44" font-weight="800" letter-spacing="-1">filter</text>
  </g>

  <text x="540" y="210" text-anchor="middle" fill="#E8821E" font-size="26" letter-spacing="6">CERTIFIED COMPONENTS &amp; STANDARDS</text>

  <text x="540" y="270" text-anchor="middle" fill="#FFFFFF" font-size="58" font-weight="600">Engineered with</text>
  <text x="540" y="345" text-anchor="middle" fill="#E8821E" font-size="58" font-style="italic" font-weight="700">industry-certified</text>
  <text x="540" y="420" text-anchor="middle" fill="#FFFFFF" font-size="58" font-weight="600">components.</text>

  <!-- badges grid -->
  <g>
    <!-- WQA -->
    <rect x="90" y="540" width="420" height="260" rx="24" fill="#0F2742" stroke="#2C5A82" stroke-width="1.5"/>
    <text x="300" y="640" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="700">WQA</text>
    <text x="300" y="690" text-anchor="middle" fill="#9FB3C8" font-size="24">Water Quality Association</text>
    <text x="300" y="740" text-anchor="middle" fill="#E8821E" font-size="26" font-weight="700">MEMBER</text>
    <text x="300" y="775" text-anchor="middle" fill="#9FB3C8" font-size="22">#10474427</text>

    <!-- NSF -->
    <rect x="570" y="540" width="420" height="260" rx="24" fill="#0F2742" stroke="#2C5A82" stroke-width="1.5"/>
    <circle cx="780" cy="640" r="55" fill="#FFFFFF"/>
    <text x="780" y="655" text-anchor="middle" fill="#0B1A2B" font-size="40" font-weight="700">NSF</text>
    <text x="780" y="740" text-anchor="middle" fill="#E8821E" font-size="26" font-weight="700">CERTIFIED</text>
    <text x="780" y="775" text-anchor="middle" fill="#9FB3C8" font-size="22">Certified components</text>

    <!-- ANSI -->
    <rect x="90" y="830" width="420" height="260" rx="24" fill="#0F2742" stroke="#2C5A82" stroke-width="1.5"/>
    <text x="300" y="930" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="700">ANSI</text>
    <text x="300" y="980" text-anchor="middle" fill="#9FB3C8" font-size="22">American National Standards</text>
    <text x="300" y="1035" text-anchor="middle" fill="#E8821E" font-size="26" font-weight="700">STANDARDS</text>

    <!-- Made in USA -->
    <rect x="570" y="830" width="420" height="260" rx="24" fill="#0F2742" stroke="#2C5A82" stroke-width="1.5"/>
    <g transform="translate(720,905)">
      <rect width="120" height="78" fill="#FFFFFF" stroke="#2C5A82"/>
      <rect width="120" height="6" y="0" fill="#B22234"/><rect width="120" height="6" y="12" fill="#B22234"/>
      <rect width="120" height="6" y="24" fill="#B22234"/><rect width="120" height="6" y="36" fill="#B22234"/>
      <rect width="120" height="6" y="48" fill="#B22234"/><rect width="120" height="6" y="60" fill="#B22234"/>
      <rect width="50" height="42" fill="#3C3B6E"/>
    </g>
    <text x="780" y="1035" text-anchor="middle" fill="#E8821E" font-size="26" font-weight="700">MADE IN USA</text>
  </g>

  <text x="540" y="1180" text-anchor="middle" fill="#FFFFFF" font-size="32">Premium tech, real standards, total peace of mind.</text>

  <rect x="270" y="1230" width="540" height="84" rx="42" fill="#E8821E"/>
  <text x="540" y="1284" text-anchor="middle" fill="#0B1A2B" font-size="32" font-weight="700">Book your free water test → DM</text>
</svg>
