    <rect x="80" y="410" width="430" height="190" rx="22" fill="#0F2742" stroke="#2C5A82" stroke-width="1.5"/>
    <text x="110" y="465" fill="#E8821E" font-size="30" font-weight="700">01</text>
    <text x="110" y="510" fill="#FFFFFF" font-size="28" font-weight="600">KDF 55</text>
    <text x="110" y="548" fill="#9FB3C8">Heavy-metal protection:</text>
    <text x="110" y="578" fill="#9FB3C8">chlorine, lead, mercury.</text>

    <!-- 02 -->
    <rect x="570" y="410" width="430" height="190" rx="22" fill="#0F2742" stroke="#2C5A82" stroke-width="1.5"/>
    <text x="600" y="465" fill="#E8821E" font-size="30" font-weight="700">02</text>
    <text x="600" y="510" fill="#FFFFFF" font-size="28" font-weight="600">Ion Exchange Resin</text>
    <text x="600" y="548" fill="#9FB3C8">Softer water — less dry</text>
