  <text x="540" y="1270" text-anchor="middle" fill="#FFFFFF" font-size="24" letter-spacing="3" opacity="0.85">FELIPE VIEIRA • OFFICIAL MY PURE FILTERS REP • ORLANDO &amp; MIAMI</text>
