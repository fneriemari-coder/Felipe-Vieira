  <rect width="1080" height="1350" fill="url(#bg4)"/>

  <text x="80" y="140" fill="#E8821E" font-size="26" letter-spacing="5">FULL HOME SYSTEM</text>
  <text x="80" y="225" fill="#FFFFFF" font-size="62" font-weight="700">4 layers. 1 promise:</text>
  <text x="80" y="295" fill="#FFFFFF" font-size="62" font-weight="700">pure water, everywhere.</text>
  <text x="80" y="350" fill="#9FB3C8" font-size="28">Quatro camadas. Uma casa inteira protegida.</text>

  <!-- 4 cards -->
