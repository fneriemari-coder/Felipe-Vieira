    <text x="110" y="768" fill="#9FB3C8">Beyond conventional:</text>
    <text x="110" y="798" fill="#9FB3C8">VOCs, PFAS, pesticides.</text>

    <!-- 04 -->
    <rect x="570" y="630" width="430" height="190" rx="22" fill="#0F2742" stroke="#2C5A82" stroke-width="1.5"/>
    <text x="600" y="685" fill="#E8821E" font-size="30" font-weight="700">04</text>
    <text x="600" y="730" fill="#FFFFFF" font-size="28" font-weight="600">Premium Quartz Bed</text>
    <text x="600" y="768" fill="#9FB3C8">Auto backwashing.</text>
    <text x="600" y="798" fill="#9FB3C8">Install once, protect forever.</text>
