<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Poppins, Arial, sans-serif">
  <!-- Reference sheet: 14 highlight covers. Each circle = export 1080x1920 with this icon centered. -->
  <rect width="1200" height="900" fill="#F2F4F6"/>
  <text x="600" y="50" text-anchor="middle" fill="#0B1A2B" font-size="30" font-weight="700">Capas de Destaques — My Pure Filters (fundo navy + ícone branco)</text>
  <text x="600" y="82" text-anchor="middle" fill="#5C6B7A" font-size="18">Exporte cada ícone como story 1080x1920 com o círculo centralizado. Acento laranja opcional.</text>

  <defs>
    <radialGradient id="hc" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#143352"/><stop offset="100%" stop-color="#0B1A2B"/>
    </radialGradient>
  </defs>

  <!-- helper: row of circles -->
  <g stroke="#FFFFFF" stroke-width="4" fill="none">
    <!-- Row 1 -->
    <g transform="translate(120,180)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <path d="M0 -34 C 20 -4, 30 12, 30 24 a 30 30 0 1 1 -60 0 C -30 12, -20 -4, 0 -34 Z"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Comece Aqui</text>
    </g>
    <g transform="translate(310,180)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <path d="M0 -36 L 30 -22 V 6 C 30 28, 0 40, 0 40 C 0 40, -30 28, -30 6 V -22 Z"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Sobre Nós</text>
    </g>
    <g transform="translate(500,180)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <path d="M-22 -30 H 22 V 30 a 22 22 0 0 1 -44 0 Z"/>
      <line x1="-22" y1="2" x2="22" y2="2"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Qualidade Água</text>
    </g>
    <g transform="translate(690,180)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <path d="M0 28 C -40 -2, -24 -36, 0 -18 C 24 -36, 40 -2, 0 28 Z"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Saúde</text>
    </g>
    <g transform="translate(880,180)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <circle cx="0" cy="0" r="14"/>
      <circle cx="0" cy="0" r="30"/>
      <line x1="0" y1="-44" x2="0" y2="-30"/><line x1="0" y1="30" x2="0" y2="44"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Tecnologia</text>
    </g>
    <g transform="translate(1070,180)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <path d="M0 -34 L8 -12 L32 -12 L13 4 L20 28 L0 14 L-20 28 L-13 4 L-32 -12 L-8 -12 Z"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Benefícios</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(120,430)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <line x1="0" y1="-34" x2="0" y2="34"/>
      <path d="M-30 20 L -8 -10 L 6 8 L 30 -22"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Antes/Depois</text>
    </g>
    <g transform="translate(310,430)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <path d="M-32 4 L 0 -28 L 32 4 V 32 H -32 Z"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Instalações</text>
    </g>
    <g transform="translate(500,430)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <path d="M-32 -22 H 32 V 14 H -6 L -22 30 V 14 H -32 Z"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Depoimentos</text>
    </g>
    <g transform="translate(690,430)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <circle cx="-12" cy="-6" r="12"/><circle cx="14" cy="-6" r="12"/>
      <path d="M-30 30 C -26 6, 30 6, 34 30"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Clientes</text>
    </g>
    <g transform="translate(880,430)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <path d="M0 -34 L20 -22 V6 C20 26 0 38 0 38 C0 38 -20 26 -20 6 V-22 Z"/>
      <path d="M-9 0 L-2 8 L12 -8" stroke="#E8821E"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Garantia</text>
    </g>
    <g transform="translate(1070,430)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <path d="M-30 -10 L 6 -28 L 30 -4 L -6 14 Z"/>
      <circle cx="-14" cy="-6" r="4" fill="#E8821E" stroke="none"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Promoções</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(120,680)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <text x="0" y="20" text-anchor="middle" fill="#FFFFFF" font-size="60" font-weight="700" stroke="none">?</text>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">FAQ</text>
    </g>
    <g transform="translate(310,680)">
      <circle cx="0" cy="0" r="70" fill="url(#hc)" stroke="none"/>
      <path d="M-28 -20 C -28 -28 -18 -28 -12 -20 C -6 -12 22 22 28 26 C 20 32 -6 8 -16 0 C -26 -8 -28 -12 -28 -20 Z"/>
      <text x="0" y="110" text-anchor="middle" fill="#0B1A2B" font-size="17" stroke="none">Contato</text>
    </g>
  </g>
</svg>
