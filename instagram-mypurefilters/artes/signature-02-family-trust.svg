<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="navyband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2742"/>
      <stop offset="100%" stop-color="#0B1A2B"/>
    </linearGradient>
    <linearGradient id="photofade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1A2B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B1A2B" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- PHOTO AREA: cole family-child-trust.jpg (criança bebendo água) -->
  <rect width="1080" height="1350" fill="#C9B79C"/>
  <text x="540" y="430" text-anchor="middle" fill="#7D6C52" font-size="30" font-family="Poppins,Arial,sans-serif">[ FOTO: família/criança — family-child-trust.jpg ]</text>
  <rect x="0" y="650" width="1080" height="700" fill="url(#photofade)"/>

  <!-- logo top -->
  <g transform="translate(540,150)" text-anchor="middle" font-family="Poppins,Arial,sans-serif">
    <text y="0" fill="#FFFFFF" font-size="20" letter-spacing="7" font-weight="500" opacity="0.9">MY PURE</text>
    <text y="56" fill="#FFFFFF" font-size="66" font-weight="800" letter-spacing="-2">filter</text>
  </g>

  <!-- accent line -->
  <rect x="90" y="930" width="80" height="6" rx="3" fill="#E8821E"/>

  <!-- headline -->
  <text x="90" y="1010" fill="#FFFFFF" font-size="58" font-weight="700" font-family="Poppins,Arial,sans-serif">The people you love</text>
  <text x="90" y="1080" fill="#FFFFFF" font-size="58" font-weight="700" font-family="Poppins,Arial,sans-serif">deserve water you</text>
  <text x="90" y="1150" fill="#E8821E" font-size="58" font-weight="700" font-family="Poppins,Arial,sans-serif">can trust.</text>

  <text x="90" y="1210" fill="#9FB3C8" font-size="30" font-family="Poppins,Arial,sans-serif">Água pura e sem cloro para sua família 💧</text>

  <!-- CTA -->
  <rect x="90" y="1250" width="520" height="78" rx="39" fill="#E8821E"/>
  <text x="350" y="1300" text-anchor="middle" fill="#0B1A2B" font-size="30" font-weight="700" font-family="Poppins,Arial,sans-serif">Free Water Test → DM</text>

  <text x="640" y="1300" fill="#9FB3C8" font-size="22" font-family="Poppins,Arial,sans-serif" letter-spacing="2">ORLANDO &amp; MIAMI</text>
</svg>
