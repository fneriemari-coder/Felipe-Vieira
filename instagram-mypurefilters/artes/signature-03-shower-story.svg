  <text x="540" y="1740" text-anchor="middle" fill="#F1E8DA" font-size="30" font-family="Poppins,Arial,sans-serif">the shower filter</text>
  <text x="540" y="1790" text-anchor="middle" fill="#D9CBB8" font-size="26" font-family="Poppins,Arial,sans-serif" letter-spacing="3">ORLANDO · MIAMI</text>
