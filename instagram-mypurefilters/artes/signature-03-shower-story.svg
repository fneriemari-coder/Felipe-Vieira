    <text y="0" fill="#FFFFFF" font-size="22" letter-spacing="8" font-weight="500" opacity="0.9">MY PURE</text>
    <text y="64" fill="#FFFFFF" font-size="74" font-weight="800" letter-spacing="-2">filter</text>
  </g>

  <!-- serif beauty headline -->
  <text x="540" y="1180" text-anchor="middle" fill="#FFFFFF" font-size="100" font-style="italic" font-family="Georgia,'Times New Roman',serif">healthier skin</text>
