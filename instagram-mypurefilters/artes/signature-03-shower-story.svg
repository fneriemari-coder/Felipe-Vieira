<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="storyfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1A130C" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- PHOTO/VIDEO AREA: cole reel-shower-05-skin.jpg ou reel-shower-06-hair.jpg -->
  <rect width="1080" height="1920" fill="#D8CBB8"/>
